<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="blob" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16243f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <circle cx="200" cy="200" r="170" fill="url(#blob)"/>

  <!-- confetti dots -->
  <circle cx="70" cy="90" r="6" fill="#93c5fd"/>
  <circle cx="330" cy="120" r="5" fill="#e0f2fe"/>
  <circle cx="60" cy="290" r="5" fill="#60a5fa"/>
  <circle cx="340" cy="300" r="6" fill="#93c5fd"/>
  <circle cx="95" cy="330" r="4" fill="#e0f2fe"/>
  <circle cx="310" cy="70" r="4" fill="#60a5fa"/>

  <!-- phone mockup -->
  <rect x="130" y="80" width="140" height="250" rx="22" fill="url(#phoneBody)" stroke="#93c5fd" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="146" y="104" width="108" height="16" rx="8" fill="#e0f2fe" fill-opacity="0.85"/>
  <rect x="146" y="132" width="108" height="60" rx="10" fill="url(#cardFill)" fill-opacity="0.9"/>
  <rect x="146" y="202" width="70" height="10" rx="5" fill="#93c5fd" fill-opacity="0.6"/>
  <rect x="146" y="220" width="108" height="10" rx="5" fill="#93c5fd" fill-opacity="0.35"/>
  <rect x="146" y="238" width="90" height="10" rx="5" fill="#93c5fd" fill-opacity="0.35"/>
  <rect x="146" y="270" width="108" height="34" rx="17" fill="#60a5fa"/>
  <text x="200" y="292" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0c1929" text-anchor="middle">Publish</text>

  <!-- floating pen / cursor tool -->
  <g transform="translate(288,150) rotate(20)">
    <rect x="0" y="0" width="10" height="60" rx="5" fill="#e0f2fe"/>
    <polygon points="0,60 10,60 5,78" fill="#93c5fd"/>
  </g>

  <!-- floating palette -->
  <g transform="translate(78,150)">
    <ellipse cx="0" cy="0" rx="26" ry="20" fill="#0f172a" stroke="#93c5fd" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="-10" cy="-6" r="4" fill="#60a5fa"/>
    <circle cx="4" cy="-9" r="4" fill="#93c5fd"/>
    <circle cx="12" cy="0" r="4" fill="#e0f2fe"/>
    <circle cx="0" cy="8" r="4" fill="#60a5fa"/>
  </g>
</svg>
